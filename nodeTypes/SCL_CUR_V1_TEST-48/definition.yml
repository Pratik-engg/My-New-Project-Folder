fileVersion: 1
id: "48"
isDisabled: false
metadata:
  defaultStorageLocation: null
  error: null
  nodeMetadataSpec: |-
    capitalized: SCL_CUR_V1
    short: CUR
    plural: Cleansed Current
    tagColor: '#7F7C7C'

    config:
      - groupName: Options
        items:
        - type: materializationSelector
          default: table
          options:
          - table
          - view
          isRequired: true

        - type: multisourceToggle
          enableIf: "{% if node.materializationType == 'table' %} true {% else %} false {% endif %}" 

        - type: overrideSQLToggle
          enableIf: "{% if node.materializationType == 'view' %} true {% else %} false {% endif %}"
          
        - displayName: Multi Source Strategy
          attributeName: insertStrategy
          type: dropdownSelector
          default: INSERT
          options:
          - "INSERT"
          - "UNION"
          - "UNION ALL"
          isRequired: true
          enableIf: "{% if node.isMultisource %} true {% else %} false {% endif %}"

        - displayName: Enable Tests
          attributeName: testsEnabled
          type: toggleButton
          default: true
          
        - displayName: Pre-SQL
          attributeName: preSQL
          type: textBox
          syntax: sql
          isRequired: false

        - displayName: Post-SQL
          attributeName: postSQL
          type: textBox
          syntax: sql
          isRequired: false

    systemColumns:
      - displayName: BATCH_SOURCE
        transform: '''{{parameters.data_load.source}}'''
        dataType: STRING
        placement: end
        attributeName: isBatchSource
        nullable: false

      - displayName: BATCH_NAME
        transform: '''{{parameters.data_load.name}}'''
        dataType: STRING
        placement: end
        attributeName: isBatchName
        nullable: false

      - displayName: BATCH_REF
        transform: '''{{parameters.data_load.reference}}'''
        dataType: STRING
        placement: end
        attributeName: isBatchRef
        nullable: false

      - displayName: BATCH_DATE
        transform: '''{{parameters.data_load.date}}'''
        dataType: TIMESTAMP_NTZ
        placement: end
        attributeName: isBatchDate
        nullable: false
name: SCL_CUR_V1_TEST
type: NodeType
